<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="查看 GitHub Pages 中托管的 Archify 图表与 SVG 文件" />
    <title>SVG Maker</title>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./index.html">SVG Maker</a>
    </header>
    <main class="page-shell">
      <section class="hero">
        <p class="eyebrow">DIAGRAM LIBRARY</p>
        <h1>图表资源</h1>
        <p>查看 Archify 图表与 SVG 文件，并复制 Notion 嵌入地址。</p>
      </section>
      <section aria-labelledby="archify-title">
        <div class="section-heading">
          <h2 id="archify-title">Archify 图表</h2>
        </div>
        <div id="archify-status" class="status" role="status">正在读取图表清单…</div>
        <div id="archify-list" class="file-list" aria-live="polite"></div>
      </section>
      <section aria-labelledby="library-title">
        <div class="section-heading">
          <h2 id="library-title">SVG 文件</h2>
          <span id="file-count" class="count-badge" hidden></span>
        </div>
        <div id="status" class="status" role="status">正在读取文件清单…</div>
        <div id="file-list" class="file-list" aria-live="polite"></div>
      </section>
    </main>
    <script type="module" src="./archify-list.js"></script>
    <script type="module" src="./list.js"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title description">
  <title id="title">SVG Maker 示例</title>
  <desc id="description">展示 SVG 从源代码到 GitHub Pages 和 Notion 的流程。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff3ff"/>
      <stop offset="1" stop-color="#dce6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#17306f" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="32" fill="url(#background)"/>
  <g font-family="Inter, system-ui, sans-serif" fill="#172033">
    <text x="72" y="96" font-size="20" font-weight="700" letter-spacing="3" fill="#3157d5">SVG MAKER</text>
    <text x="72" y="150" font-size="42" font-weight="800">一个文件，持续更新</text>
  </g>
  <g filter="url(#shadow)" font-family="Inter, system-ui, sans-serif">
    <rect x="72" y="230" width="220" height="132" rx="20" fill="#fff"/>
    <rect x="370" y="230" width="220" height="132" rx="20" fill="#fff"/>
    <rect x="668" y="230" width="220" height="132" rx="20" fill="#fff"/>
    <text x="182" y="282" text-anchor="middle" fill="#3157d5" font-size="17" font-weight="800">SVG 源代码</text>
    <text x="182" y="318" text-anchor="middle" fill="#647089" font-size="15">AI 或人工编辑</text>
    <text x="480" y="282" text-anchor="middle" fill="#3157d5" font-size="17" font-weight="800">GitHub Pages</text>
    <text x="480" y="318" text-anchor="middle" fill="#647089" font-size="15">固定公开地址</text>
    <text x="778" y="282" text-anchor="middle" fill="#3157d5" font-size="17" font-weight="800">Notion</text>
    <text x="778" y="318" text-anchor="middle" fill="#647089" font-size="15">嵌入最新内容</text>
  </g>
  <g fill="none" stroke="#3157d5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M312 296h38"/><path d="m341 284 12 12-12 12"/>
    <path d="M610 296h38"/><path d="m639 284 12 12-12 12"/>
  </g>
  <text x="480" y="454" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#52617e">修改同一路径的文件，展示地址保持不变</text>
</svg>
